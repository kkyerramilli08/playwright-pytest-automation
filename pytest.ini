[pytest]
minversion = 7.0
base_url = https://www.saucedemo.com
testpaths =
    02_pytest_scenarios
    03_playwright_pytest
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow
    sanity: marks sanity tests
    smoke: marks smoke tests
    reg: marks regression tests
    order: sets the execution order for a test
log_cli = false
log_level = INFO
addopts =   --strict-markers
            --tb=short
            --headed
            --browser=chromium
            #--video=retain-on-failure
            --reruns=0
            --reruns-delay=2
            --slowmo=1000
            --html=Reports/report.html
            --alluredir=Reports/allure-results
            # Reporting options require pytest-html and allure-pytest.
            # Run them explicitly with the project virtual environment:
            # .venv/bin/python -m pytest --html=Reports/report.html --alluredir=Reports/allure-results
